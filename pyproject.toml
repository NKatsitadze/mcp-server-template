[project]
name = "example-mcp"
version = "0.1.0"
description = "Template MCP server: safe read-first tools over an HTTP API, with docs search, evals and an LLM judge"
readme = "README.md"
license = "MIT"
authors = [{ name = "Nika" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4.15.1",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    # <2: langchain-mcp-adapters (the test agent) does not support mcp 2.x yet.
    "mcp>=1.30,<2",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
]

[project.scripts]
example-mcp = "example_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "example_mcp"

[dependency-groups]
agent = [
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.15",
    "pyyaml>=6.0.3",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.uv]
default-groups = ["agent", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
