name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --all-groups --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        # Everything is mocked except the stdio end-to-end test, which uses a local refused port.
        # No secrets and no network calls are needed.
        run: uv run pytest
